name: Agent — grade yesterday

# Auto-grades yesterday's pending picks against ESPN final scores.
# Reads/writes Turso directly — no SQLite artifact dance.
# Posts grader report to Discord.

on:
  workflow_dispatch:
    inputs:
      daysBack:
        description: How many days back to grade
        required: false
        default: "1"
  schedule:
    # 13:00 UTC = 09:00 ET (after late games finalize)
    - cron: "0 13 * * *"

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run auto-grader (bot picks via AgentOutcome)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # Mirror so Prisma's schema-time URL parser doesn't throw; libSQL
          # adapter overrides at runtime. See agent-run.yml for context.
          DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          DAYS_BACK: ${{ github.event.inputs.daysBack || '1' }}
        run: npm run agent:grade -- "$DAYS_BACK"

      - name: Run snapshot grader (market picks + player props)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # Mirror so Prisma's schema-time URL parser doesn't throw; libSQL
          # adapter overrides at runtime. See agent-run.yml for context.
          DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          DAYS_BACK: ${{ github.event.inputs.daysBack || '1' }}
        run: npm run picks:grade -- "$DAYS_BACK"

      # NOTE: there is deliberately no CLV step here. CLV capture is owned
      # entirely by agent-clv.yml, which sweeps every 20 min through the game
      # window and finalizes each pick at in-play (convergence-to-close). A
      # 13:00 UTC "catch-all" using the [10, 90] forward window scans games
      # starting 13:10-14:30 UTC — i.e. nothing, since last night's picks are
      # hours past tip and outside the scan window. It captured nothing and was
      # removed (2026-06-11) rather than masquerade as a safety net.
