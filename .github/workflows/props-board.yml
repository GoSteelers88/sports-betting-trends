name: Props board — sharp-vs-soft player props

# Daily player-prop +EV measurement: de-vigged Pinnacle prop lines (free
# guest API) vs soft-book prop prices (The Odds API). Budget-capped at
# PROPS_CREDIT_BUDGET credits/run (3 markets — TotalBases/HomeRuns/Strikeouts
# — across as many events as the budget buys) ≈ 90 credits/month — inside the
# free tier next to the other Odds API draws. Appends matched rows to
# props-board-log.json. Places NOTHING — this measures whether props are the
# volume fix for the de-vig thesis before any book is pre-registered.

on:
  workflow_dispatch:
  schedule:
    # Weekdays 21:10 UTC — ~2h before typical MLB evening first pitch, when
    # both Pinnacle and soft books have posted prop lines.
    - cron: "10 21 * * 1-5"

permissions:
  contents: write # push the board log back

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      # 3 default markets → 6 events/run (~18 credits) ≈ 90/month weekdays.
      PROPS_CREDIT_BUDGET: "18"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Pull sharp (Pinnacle props) + soft (Odds API props)
        run: |
          npm run ingest:sharp-props || echo "pinnacle props failed (non-fatal)"
          npm run ingest:soft-props || echo "odds-api props failed (non-fatal)"

      - name: Build board + append log
        run: npm run board:props

      - name: Commit board log back (allowlisted file only)
        if: success()
        run: |
          git config user.name "props-board-bot"
          git config user.email "58962244+GoSteelers88@users.noreply.github.com"
          ALLOWED=( "data/processed/props-board-log.json" )
          SECRET_RE='sk-ant-(api|oat|admin)|sk-[A-Za-z0-9]{40,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|tursodatabase\.com|libsql://|discord(app)?\.com/api/webhooks/|-----BEGIN [A-Z ]*PRIVATE KEY-----|[Aa]uthorization":\s*"Bearer'
          for f in "${ALLOWED[@]}"; do
            [ -f "$f" ] || continue
            if grep -qE "$SECRET_RE" "$f"; then
              echo "ABORT: $f matched secret-grep regex; refusing to commit."
              exit 1
            fi
          done
          git add "${ALLOWED[@]}" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no board-log changes to commit"
            exit 0
          fi
          DATE_TAG=$(date -u +"%Y-%m-%dT%H:%MZ")
          git commit -m "props-board: tick ${DATE_TAG}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin master && git push origin master && break
            echo "push attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            git stash drop 2>/dev/null || true
            sleep 5
          done

      # Optional dead-man's switch: create a check at healthchecks.io and set
      # the HC_PING_PROPS secret to its ping URL. Skips silently when unset.
      - name: Heartbeat ping
        if: success()
        env:
          PING: ${{ secrets.HC_PING_PROPS }}
        run: '[ -z "$PING" ] || curl -fsS -m 10 --retry 3 "$PING" > /dev/null || true'
