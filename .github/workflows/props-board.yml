name: Props board — sharp-vs-soft player props

# Daily player-prop +EV measurement: de-vigged Pinnacle prop lines (free
# guest API) vs soft-book prop prices (The Odds API). Per-sport credit budgets:
#   MLB  — PROPS_CREDIT_BUDGET      (TotalBases/HomeRuns/Strikeouts) ≈ 90/mo
#   WNBA — PROPS_WNBA_CREDIT_BUDGET (Points/Rebounds/Assists)        ≈ 45/mo
# ≈ 135 credits/month combined — inside the free tier next to the other Odds
# API draws. Appends matched rows (league-tagged) to props-board-log.json.
# Places NOTHING — this measures whether props are the volume fix for the
# de-vig thesis before any book is pre-registered.

on:
  workflow_dispatch:
  schedule:
    # DAILY 21:10 UTC — ~2h before typical MLB evening first pitch, when both
    # Pinnacle and soft books have posted prop lines. Runs every day, NOT just
    # weekdays: MLB plays 7 days/week and WNBA leans heavily on weekends, so the
    # old "* * 1-5" schedule silently left Sat/Sun slates UNMEASURED — the
    # parlay-paper cron (which runs daily at 21:40) would then assemble from a
    # board log with no weekend ticks. The freshness gate in props-board.ts now
    # also refuses to log stale matches, so a missed run degrades honestly
    # instead of poisoning the measurement log.
    - cron: "10 21 * * *"

permissions:
  contents: write # push the board log back

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      # MLB: 3 markets → 6 events (~18 credits). WNBA: 3 markets → 3 events
      # (~9 credits). ~27 credits/run × ~30 days ≈ 810/month — OVER the 500/mo
      # free tier if left here. The board now runs DAILY (was weekdays), so the
      # per-run budgets are trimmed to keep the monthly draw inside the free
      # tier alongside the other Odds API jobs: 9 + 6 = 15 credits/run × 30 ≈
      # 450/month. Raise these only if the plan tier increases.
      PROPS_CREDIT_BUDGET: "9"
      PROPS_WNBA_CREDIT_BUDGET: "6"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Pull sharp (Pinnacle props) + soft (Odds API props)
        run: |
          npm run ingest:sharp-props || echo "pinnacle props failed (non-fatal)"
          npm run ingest:soft-props || echo "odds-api props failed (non-fatal)"

      - name: Build board + append log
        run: npm run board:props

      - name: Commit board log back (allowlisted file only)
        if: success()
        run: |
          git config user.name "props-board-bot"
          git config user.email "58962244+GoSteelers88@users.noreply.github.com"
          # Explicit filenames only — this array is NOT glob-expanded by the
          # shell (it's a literal list), so every feed the ingest steps write
          # must be named here. The raw sharp/soft prop feeds are what the chat
          # get_props_board tool + the dashboard Prop Plays overlay read at
          # runtime; committing them here is what gets them into the Vercel
          # bundle. Reality (verified against the ingest scripts):
          #   sharp: mlb, nba, wnba  (scrape-pinnacle-props.ts SPORTS)
          #   soft:  mlb, wnba       (ingest-soft-props.ts SPORTS — NBA has no
          #                           soft feed, so no latest-soft-props-nba.json)
          ALLOWED=(
            "data/processed/props-board-log.json"
            "data/processed/latest-sharp-props-mlb.json"
            "data/processed/latest-sharp-props-nba.json"
            "data/processed/latest-sharp-props-wnba.json"
            "data/processed/latest-soft-props-mlb.json"
            "data/processed/latest-soft-props-wnba.json"
          )
          SECRET_RE='sk-ant-(api|oat|admin)|sk-[A-Za-z0-9]{40,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|tursodatabase\.com|libsql://|discord(app)?\.com/api/webhooks/|-----BEGIN [A-Z ]*PRIVATE KEY-----|[Aa]uthorization":\s*"Bearer'
          for f in "${ALLOWED[@]}"; do
            [ -f "$f" ] || continue
            if grep -qE "$SECRET_RE" "$f"; then
              echo "ABORT: $f matched secret-grep regex; refusing to commit."
              exit 1
            fi
          done
          git add "${ALLOWED[@]}" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no board-log changes to commit"
            exit 0
          fi
          DATE_TAG=$(date -u +"%Y-%m-%dT%H:%MZ")
          git commit -m "props-board: tick ${DATE_TAG}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin master && git push origin master && break
            echo "push attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            git stash drop 2>/dev/null || true
            sleep 5
          done

      # Optional dead-man's switch: create a check at healthchecks.io and set
      # the HC_PING_PROPS secret to its ping URL. Skips silently when unset.
      - name: Heartbeat ping
        if: success()
        env:
          PING: ${{ secrets.HC_PING_PROPS }}
        run: '[ -z "$PING" ] || curl -fsS -m 10 --retry 3 "$PING" > /dev/null || true'
