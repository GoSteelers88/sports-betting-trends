name: Agent — weekly dream

# Consolidates the agent's memory store: merges duplicates, retires stale rules,
# surfaces patterns from graded outcomes. Uses Opus for higher-quality reflection.

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC Monday = 02:00 ET Mon (overnight, low traffic)
    - cron: "0 6 * * 1"

jobs:
  dream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Pull latest graded DB artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: agent-grade.yml
          name_is_regexp: true
          name: ^agent-grade-
          path: ./_artifact
          if_no_artifact_found: warn

      - name: Restore graded DB
        run: |
          if [ -f ./_artifact/dev.db ]; then
            cp ./_artifact/dev.db ./prisma/dev.db
            echo "restored graded dev.db from artifact"
          else
            echo "no graded artifact found; dream will have no outcomes to learn from"
          fi

      - name: Run dream
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: "file:./prisma/dev.db"
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npm run agent:dream

      - name: Upload dreamed DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-dream-${{ github.run_id }}
          path: prisma/dev.db
          retention-days: 90
