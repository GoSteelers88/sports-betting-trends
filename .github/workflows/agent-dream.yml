name: Agent — weekly dream

# Consolidates the agent's memory store: merges duplicates, retires stale rules,
# surfaces patterns from graded outcomes. Reads/writes Turso directly.
# Uses Opus for higher-quality reflection.

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC Monday = 02:00 ET Mon (overnight, low traffic)
    - cron: "0 6 * * 1"

jobs:
  dream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run dream
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # Mirror so Prisma's schema-time URL parser doesn't throw; libSQL
          # adapter overrides at runtime. See agent-run.yml for context.
          DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        run: npm run agent:dream
