name: Agent — analyze slate

# Runs the orchestrator (data health → ingest if needed → analyst → critic → bankroll guard).
# Picks are posted to Discord. Twice daily by default (morning + pre-game).

on:
  workflow_dispatch:
    inputs:
      league:
        description: League to analyze (NBA | MLB | BOTH)
        required: true
        default: BOTH
        type: choice
        options:
          - NBA
          - MLB
          - BOTH
  schedule:
    # 14:00 UTC = 10:00 ET (morning slate scan)
    - cron: "0 14 * * *"
    # 22:30 UTC = 18:30 ET (pre-game slate scan, after lineups)
    - cron: "30 22 * * *"

permissions:
  contents: write   # needed to push refreshed data files back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so we can push back; default is shallow
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Python (for ingest scripts)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r scripts/python/requirements.txt

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply Prisma migrations (creates ephemeral SQLite)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Install Playwright Chromium (for prop scraper)
        run: npx playwright install --with-deps chromium

      - name: Refresh summary + injuries + NBA props (so dashboard stays current)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          THE_ODDS_LEAGUE: basketball_nba
          THE_ODDS_REGIONS: us
          THE_ODDS_MARKETS: h2h,spreads,totals
          THE_ODDS_ODDS_FORMAT: american
          DATABASE_URL: "file:./prisma/dev.db"
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          npm run ingest:injuries || echo "injuries refresh failed (non-fatal)"
          npm run ingest:free || echo "summary refresh failed (non-fatal)"
          npm run scrape:nba-props || echo "props scrape failed (non-fatal)"

      - name: Run orchestrator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          THE_ODDS_LEAGUE: basketball_nba
          THE_ODDS_REGIONS: us
          THE_ODDS_MARKETS: h2h,spreads,totals
          THE_ODDS_ODDS_FORMAT: american
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_URL: "file:./prisma/dev.db"
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          LEAGUE="${{ github.event.inputs.league || 'BOTH' }}"
          npm run agent:run -- "$LEAGUE"

      - name: Commit refreshed data back to repo
        if: success()
        run: |
          git config user.name "agent-bot"
          git config user.email "agent-bot@users.noreply.github.com"
          # Only commit if data files actually changed
          if git diff --quiet -- data/processed/; then
            echo "no data changes to commit"
            exit 0
          fi
          git add data/processed/*.json
          DATE_TAG=$(date -u +"%Y-%m-%dT%H:%MZ")
          git commit -m "auto-publish: agent run ${DATE_TAG} (refreshed odds + model snapshots)"
          # Push with rebase to handle concurrent commits
          for i in 1 2 3; do
            git pull --rebase origin master && git push origin master && break
            echo "push attempt $i failed, retrying..."
            sleep 5
          done

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-run-${{ github.run_id }}
          path: |
            data/processed/*.json
            prisma/dev.db
          retention-days: 14
