name: Agent — analyze slate

# Runs the orchestrator (data health → ingest if needed → analyst → critic → bankroll guard).
# Reads/writes Turso directly. Picks are posted to Discord. Twice daily by default.

on:
  workflow_dispatch:
    inputs:
      league:
        description: League to analyze (NBA | MLB | WNBA | BOTH | ALL)
        required: true
        default: BOTH
        type: choice
        options:
          - NBA
          - MLB
          - WNBA
          - BOTH
          - ALL
  schedule:
    # Off-the-hour offsets to dodge GH Actions cron congestion at :00/:30 boundaries.
    # 14:07 UTC = 10:07 ET (morning slate scan)
    - cron: "7 14 * * *"
    # 22:37 UTC = 18:37 ET (pre-game slate scan, after lineups)
    - cron: "37 22 * * *"

permissions:
  contents: write   # needed to push refreshed data files back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Single source of truth: Turso. Application code goes through the libSQL
      # adapter wired in src/lib/prisma.ts using TURSO_DATABASE_URL + TURSO_AUTH_TOKEN.
      # DATABASE_URL is mirrored only to satisfy Prisma's schema-time URL parser
      # — without it, PrismaClient construction throws "Environment variable not
      # found: DATABASE_URL" even though the adapter would override the URL at
      # runtime. This was the silent error fingerprinting agent-run logs prior
      # to the WNBA wiring change.
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      THE_ODDS_LEAGUES: basketball_nba,baseball_mlb,basketball_wnba
      THE_ODDS_REGIONS: us
      THE_ODDS_MARKETS: h2h,spreads,totals
      THE_ODDS_ODDS_FORMAT: american
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so we can push back; default is shallow
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Python (for ingest scripts)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r scripts/python/requirements.txt

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Install Playwright Chromium (for prop scraper)
        run: npx playwright install --with-deps chromium

      - name: Refresh data (odds, summary, injuries, props) and rebuild models
        run: |
          npm run ingest:odds || echo "odds refresh failed (non-fatal)"
          npm run ingest:odds || echo "odds refresh failed (non-fatal)"
          npm run ingest:injuries || echo "injuries refresh failed (non-fatal)"
          npm run ingest:free || echo "summary refresh failed (non-fatal)"
          # Rebuild league models. Inputs (efficiency files) are independent of
          # today's slate; outputs join those with current odds events. Without
          # these steps the analyst sees stale model probabilities and the
          # critic kills every pick on home/away mismatches.
          npm run ingest:nba-efficiency || echo "nba efficiency refresh failed (non-fatal)"
          npm run ingest:nba-model || echo "nba model build failed (non-fatal)"
          npm run ingest:wnba-efficiency || echo "wnba efficiency refresh failed (non-fatal — likely offseason)"
          npm run ingest:wnba-model || echo "wnba model build failed (non-fatal — likely offseason)"
          npm run scrape:nba-props || echo "nba props scrape failed (non-fatal)"
          npm run scrape:mlb-props || echo "mlb props scrape failed (non-fatal)"
          npm run scrape:mlb-signals || echo "mlb signals scrape failed (non-fatal)"
          npm run picks:log || echo "picks logger failed (non-fatal)"
          npm run picks:clv || echo "clv tracker failed (non-fatal)"

      - name: Run orchestrator
        # Pass LEAGUE via env, never interpolate ${{ }} into shell bodies.
        env:
          LEAGUE: ${{ github.event.inputs.league || 'BOTH' }}
        run: npm run agent:run -- "$LEAGUE"

      - name: Commit refreshed data back to repo (allowlisted files only)
        if: success()
        run: |
          git config user.name "agent-bot"
          git config user.email "agent-bot@users.noreply.github.com"
          # Allowlist of files the workflow is permitted to commit. Anything else
          # in data/processed/ is ignored — protects against accidental leakage
          # if a script ever writes a credential into a snapshot.
          ALLOWED=(
            "data/processed/latest-odds-api.json"
            "data/processed/latest-odds-api-baseball_mlb.json"
            "data/processed/latest-odds-api-basketball_nba.json"
            "data/processed/latest-odds-api-basketball_ncaab.json"
            "data/processed/latest-odds-api-basketball_wnba.json"
            "data/processed/latest-odds-api-icehockey_nhl.json"
            "data/processed/latest-summary.json"
            "data/processed/latest-player-props.json"
            "data/processed/injuries-nba.json"
            "data/processed/injuries-nfl.json"
            "data/processed/injuries-nhl.json"
            "data/processed/mlb-model-output.json"
            "data/processed/mlb-model-input.json"
            "data/processed/nba-model.json"
            "data/processed/nba-efficiency.json"
            "data/processed/wnba-model.json"
            "data/processed/wnba-efficiency.json"
            "data/processed/mlb-pitchers-today.json"
            "data/processed/mlb-bullpen.json"
            "data/processed/mlb-batting.json"
          )
          # Pre-commit secret scan — refuse to commit if any allowlisted file
          # contains a recognizable secret pattern. Defense in depth.
          SECRET_RE='sk-ant-(api|oat|admin)|sk-[A-Za-z0-9]{40,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|tursodatabase\.com|libsql://|api\.vercel\.com/v1/integrations/deploy/|discord(app)?\.com/api/webhooks/|-----BEGIN [A-Z ]*PRIVATE KEY-----|"(THE_ODDS_API_KEY|DISCORD_BOT_TOKEN|ANTHROPIC_API_KEY|TURSO_AUTH_TOKEN|KALSHI_API_KEY|CRON_SECRET|ASSISTANT_SECRET)"|[Aa]uthorization":\s*"Bearer'
          for f in "${ALLOWED[@]}"; do
            [ -f "$f" ] || continue
            if grep -qE "$SECRET_RE" "$f"; then
              echo "ABORT: $f matched secret-grep regex; refusing to commit."
              exit 1
            fi
          done
          # Stage only allowlisted files
          git add "${ALLOWED[@]}" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no data changes to commit"
            exit 0
          fi
          DATE_TAG=$(date -u +"%Y-%m-%dT%H:%MZ")
          git commit -m "auto-publish: agent run ${DATE_TAG} (refreshed snapshots)"
          # Push with rebase to handle concurrent commits. Ingest scripts also
          # write non-allowlisted files (e.g. latest-player-props-mlb.json),
          # which leave the working tree dirty and block `git pull --rebase`.
          # --autostash + reset to HEAD pins the rebase to our commit only and
          # discards the unstaged side-effects (they'll regenerate next run).
          for i in 1 2 3; do
            git pull --rebase --autostash origin master && git push origin master && break
            echo "push attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            git stash drop 2>/dev/null || true
            sleep 5
          done

      - name: Upload run artifacts (data only — no DB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-run-${{ github.run_id }}
          path: data/processed/*.json
          retention-days: 14
